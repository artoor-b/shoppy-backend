version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
      - export NVM_DIR="$HOME/.nvm"
      - . "$NVM_DIR/nvm.sh"
      - nvm install 22
      - nvm use 22
      - node -v
  build:
    commands:
      - npm prisma generate
      - npm build
artifacts:
  files:
    - '**/*'
